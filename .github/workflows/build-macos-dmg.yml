name: Build ELEVAY macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-universal-dmg:
    name: Build universal DMG
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install isolated desktop dependencies
        run: pnpm --dir desktop install --frozen-lockfile

      - name: Run desktop regressions
        run: pnpm --dir desktop test

      - name: Build unsigned universal DMG
        run: pnpm --dir desktop dist:mac

      - name: Verify DMG and universal application bundle
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find desktop/release -maxdepth 1 -type f -name 'ELEVAY-*-universal.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"

          mount_point="$(mktemp -d /tmp/elevay-dmg.XXXXXX)"
          cleanup() {
            hdiutil detach "$mount_point" -quiet || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point" -quiet
          app="$mount_point/ELEVAY.app"
          executable="$app/Contents/MacOS/ELEVAY"
          plist="$app/Contents/Info.plist"

          test -d "$app"
          test -x "$executable"
          test -f "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.elevay.desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "13.0.0"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$plist" | grep -F 'voice message'

          architectures="$(lipo -archs "$executable")"
          echo "$architectures" | grep -qw x86_64
          echo "$architectures" | grep -qw arm64

          mkdir -p desktop/release-artifact
          cp "$dmg" desktop/release-artifact/
          shasum -a 256 "$dmg" | sed 's#desktop/release/##' > desktop/release-artifact/SHA256SUMS.txt
          cat desktop/release-artifact/SHA256SUMS.txt

      - name: Upload universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: ELEVAY-macOS-universal-DMG
          path: desktop/release-artifact/*
          if-no-files-found: error
          retention-days: 14
